<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>下班倒數與今日賺錢計算機</title>
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
      --card-bg: rgba(255, 255, 255, 0.9);
      --text-main: #2d3748;
      --text-sub: #718096;
      --accent-color: #3182ce;
      --money-color: #2b6cb0;
      --progress-bg: #edf2f7;
      --progress-fill: linear-gradient(90deg, #4299e1, #48bb78);
      --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
      --input-bg: #ffffff;
      --border-color: #e2e8f0;
    }

    [data-theme="dark"] {
      --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      --card-bg: rgba(30, 41, 59, 0.85);
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --accent-color: #38bdf8;
      --money-color: #4ade80;
      --progress-bg: #334155;
      --progress-fill: linear-gradient(90deg, #38bdf8, #4ade80);
      --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
      --input-bg: #1e293b;
      --border-color: #475569;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      transition: background-color 0.3s, color 0.3s, border-color 0.3s;
    }

    body {
      min-height: 100vh;
      background: var(--bg-gradient);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 480px;
      background: var(--card-bg);
      backdrop-filter: blur(10px);
      border-radius: 24px;
      padding: 28px;
      box-shadow: var(--shadow);
      position: relative;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }

    .header h1 {
      font-size: 1.25rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .icon-btn {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 1.25rem;
      color: var(--text-sub);
      padding: 6px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .icon-btn:hover {
      background: rgba(0,0,0,0.05);
      color: var(--text-main);
    }

    .main-display {
      text-align: center;
      margin-bottom: 24px;
    }

    .label {
      font-size: 0.9rem;
      color: var(--text-sub);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .countdown-box {
      font-size: 2.75rem;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      color: var(--accent-color);
      margin-bottom: 16px;
    }

    .money-box {
      background: rgba(0, 0, 0, 0.03);
      padding: 16px;
      border-radius: 16px;
      margin-bottom: 20px;
    }

    [data-theme="dark"] .money-box {
      background: rgba(255, 255, 255, 0.03);
    }

    .money-amount {
      font-size: 2.25rem;
      font-weight: 800;
      color: var(--money-color);
      font-variant-numeric: tabular-nums;
    }

    .money-amount span {
      font-size: 1.2rem;
      font-weight: 600;
      margin-right: 4px;
    }

    /* 鼓勵字句展示框 */
    .quote-box {
      background: var(--progress-bg);
      border-radius: 12px;
      padding: 12px 16px;
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text-main);
      min-height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      margin-bottom: 24px;
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.02);
    }

    .progress-section {
      margin-bottom: 24px;
    }

    .progress-header {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      color: var(--text-sub);
      margin-bottom: 8px;
      font-weight: 600;
    }

    .progress-bar-bg {
      height: 12px;
      background: var(--progress-bg);
      border-radius: 6px;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background: var(--progress-fill);
      border-radius: 6px;
      transition: width 0.3s ease;
    }

    /* Modal / Settings Panel */
    .modal-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: var(--card-bg);
      backdrop-filter: blur(15px);
      border-radius: 24px;
      padding: 24px;
      display: none;
      flex-direction: column;
      z-index: 10;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .form-group {
      margin-bottom: 14px;
    }

    .form-group label {
      display: block;
      font-size: 0.85rem;
      color: var(--text-sub);
      margin-bottom: 4px;
      font-weight: 500;
    }

    .form-row {
      display: flex;
      gap: 10px;
    }

    .form-control {
      width: 100%;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid var(--border-color);
      background: var(--input-bg);
      color: var(--text-main);
      font-size: 0.95rem;
      outline: none;
    }

    .form-control:focus {
      border-color: var(--accent-color);
    }

    .btn-save {
      margin-top: auto;
      width: 100%;
      padding: 12px;
      background: var(--accent-color);
      color: white;
      border: none;
      border-radius: 12px;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
    }

    .btn-save:hover {
      opacity: 0.9;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h1>⏰ 放工計時器</h1>
      <div style="display: flex; gap: 4px;">
        <button class="icon-btn" id="theme-btn" title="切換主題">🌙</button>
        <button class="icon-btn" id="settings-btn" title="設定">⚙️</button>
      </div>
    </div>

    <div class="main-display">
      <div class="label">距離放工仲有</div>
      <div class="countdown-box" id="countdown-text">00:00:00</div>

      <div class="money-box">
        <div class="label">今日已賺金額</div>
        <div class="money-amount"><span>HK$</span><span id="money-text">0.00</span></div>
      </div>
    </div>

    <!-- 根據百分比解鎖嘅字句 -->
    <div class="quote-box" id="quote-text">
      ⏳ 準備好今日嘅賺錢之旅未？
    </div>

    <div class="progress-section">
      <div class="progress-header">
        <span>今日工作進度</span>
        <span id="progress-percent">0%</span>
      </div>
      <div class="progress-bar-bg">
        <div class="progress-bar-fill" id="progress-fill"></div>
      </div>
    </div>

    <!-- 設定 Modal -->
    <div class="modal-overlay" id="settings-modal">
      <div class="modal-header">
        <h2>設定參數</h2>
        <button class="icon-btn" id="close-settings-btn">✖</button>
      </div>

      <div class="form-group">
        <label>薪酬類型</label>
        <select class="form-control" id="salary-type">
          <option value="monthly">月薪 (HKD)</option>
          <option value="daily">日薪 (HKD)</option>
        </select>
      </div>

      <div class="form-group">
        <label id="salary-label">月薪金額</label>
        <input type="number" class="form-control" id="salary-amount" value="25000">
      </div>

      <div class="form-group" id="work-days-group">
        <label>本月工作天數 (天)</label>
        <input type="number" class="form-control" id="work-days" value="22">
      </div>

      <div class="form-row">
        <div class="form-group" style="flex:1;">
          <label>上班時間</label>
          <input type="time" class="form-control" id="start-time" value="09:00">
        </div>
        <div class="form-group" style="flex:1;">
          <label>下班時間</label>
          <input type="time" class="form-control" id="end-time" value="18:00">
        </div>
      </div>

      <div class="form-row">
        <div class="form-group" style="flex:1;">
          <label>午休開始</label>
          <input type="time" class="form-control" id="lunch-start" value="13:00">
        </div>
        <div class="form-group" style="flex:1;">
          <label>午休結束</label>
          <input type="time" class="form-control" id="lunch-end" value="14:00">
        </div>
      </div>

      <button class="btn-save" id="save-settings-btn">儲存設定</button>
    </div>
  </div>

  <script>
    // 預設設定
    const DEFAULT_CONFIG = {
      salaryType: 'monthly',
      salaryAmount: 25000,
      workDays: 22,
      startTime: '09:00',
      endTime: '18:00',
      lunchStart: '13:00',
      lunchEnd: '14:00',
      theme: 'light'
    };

    let config = { ...DEFAULT_CONFIG };

    // DOM 元素
    const countdownEl = document.getElementById('countdown-text');
    const moneyEl = document.getElementById('money-text');
    const progressFillEl = document.getElementById('progress-fill');
    const progressPercentEl = document.getElementById('progress-percent');
    const quoteEl = document.getElementById('quote-text');
    
    const settingsModal = document.getElementById('settings-modal');
    const settingsBtn = document.getElementById('settings-btn');
    const closeSettingsBtn = document.getElementById('close-settings-btn');
    const saveSettingsBtn = document.getElementById('save-settings-btn');
    const themeBtn = document.getElementById('theme-btn');

    const salaryTypeInput = document.getElementById('salary-type');
    const salaryLabel = document.getElementById('salary-label');
    const salaryAmountInput = document.getElementById('salary-amount');
    const workDaysGroup = document.getElementById('work-days-group');
    const workDaysInput = document.getElementById('work-days');
    const startTimeInput = document.getElementById('start-time');
    const endTimeInput = document.getElementById('end-time');
    const lunchStartInput = document.getElementById('lunch-start');
    const lunchEndInput = document.getElementById('lunch-end');

    // 本地儲存載入
    function loadConfig() {
      const saved = localStorage.getItem('offwork_countdown_config');
      if (saved) {
        try {
          config = { ...DEFAULT_CONFIG, ...JSON.parse(saved) };
        } catch (e) {
          console.error(e);
        }
      }
      applyTheme(config.theme);
      populateForm();
    }

    function saveConfig() {
      config.salaryType = salaryTypeInput.value;
      config.salaryAmount = parseFloat(salaryAmountInput.value) || 0;
      config.workDays = parseFloat(workDaysInput.value) || 22;
      config.startTime = startTimeInput.value;
      config.endTime = endTimeInput.value;
      config.lunchStart = lunchStartInput.value;
      config.lunchEnd = lunchEndInput.value;

      localStorage.setItem('offwork_countdown_config', JSON.stringify(config));
      settingsModal.classList.remove('active');
      updateDisplay();
    }

    function populateForm() {
      salaryTypeInput.value = config.salaryType;
      salaryAmountInput.value = config.salaryAmount;
      workDaysInput.value = config.workDays;
      startTimeInput.value = config.startTime;
      endTimeInput.value = config.endTime;
      lunchStartInput.value = config.lunchStart;
      lunchEndInput.value = config.lunchEnd;
      toggleSalaryTypeUI();
    }

    function toggleSalaryTypeUI() {
      if (salaryTypeInput.value === 'monthly') {
        salaryLabel.textContent = '月薪金額';
        workDaysGroup.style.display = 'block';
      } else {
        salaryLabel.textContent = '日薪金額';
        workDaysGroup.style.display = 'none';
      }
    }

    function applyTheme(theme) {
      config.theme = theme;
      if (theme === 'dark') {
        document.documentElement.setAttribute('data-theme', 'dark');
        themeBtn.textContent = '☀️';
      } else {
        document.documentElement.removeAttribute('data-theme');
        themeBtn.textContent = '🌙';
      }
    }

    // 將 HH:MM 轉化為今日的 Date 物件
    function parseTimeToToday(timeStr) {
      const [h, m] = timeStr.split(':').map(Number);
      const d = new Date();
      d.setHours(h, m, 0, 0);
      return d;
    }

    // 更新鼓勵字句 (根據百分比)
    function updateQuote(percentage) {
      if (percentage >= 100) {
        quoteEl.textContent = '🛋️ 放工啦！快樂時間到，即刻躺平！';
      } else if (percentage >= 75) {
        quoteEl.textContent = '👕 可以上網睇吓想買吓咩衫！';
      } else if (percentage >= 55) {
        quoteEl.textContent = '🍣 今晚食壽司郎可以拎多兩碟黑碟！';
      } else if (percentage >= 35) {
        quoteEl.textContent = '☕ 今日杯咖啡已經賺返返嚟啦！';
      } else if (percentage >= 20) {
        quoteEl.textContent = '🍔 麥當勞加大唔肉痛啦！';
      } else if (percentage >= 10) {
        quoteEl.textContent = '🍋 凍檸茶加 $2 蚊完全冇問題！';
      } else {
        quoteEl.textContent = '💪🏻 啱啱開始，加油努力賺錢！';
      }
    }

    function updateDisplay() {
      const now = new Date();
      const start = parseTimeToToday(config.startTime);
      const end = parseTimeToToday(config.endTime);
      const lunchStart = parseTimeToToday(config.lunchStart);
      const lunchEnd = parseTimeToToday(config.lunchEnd);

      // 計算今日工作秒數 (扣除午休)
      let totalWorkSeconds = (end - start) / 1000;
      let lunchSeconds = 0;
      if (lunchEnd > lunchStart && lunchStart >= start && lunchEnd <= end) {
        lunchSeconds = (lunchEnd - lunchStart) / 1000;
        totalWorkSeconds -= lunchSeconds;
      }
      if (totalWorkSeconds <= 0) totalWorkSeconds = 1;

      // 計算日薪及每秒薪水
      const dailySalary = config.salaryType === 'monthly' 
        ? (config.salaryAmount / (config.workDays || 22)) 
        : config.salaryAmount;
      const salaryPerSecond = dailySalary / totalWorkSeconds;

      // 未到上班時間
      if (now < start) {
        countdownEl.textContent = formatCountdown((end - now) / 1000);
        moneyEl.textContent = '0.00';
        progressFillEl.style.width = '0%';
        progressPercentEl.textContent = '0%';
        updateQuote(0);
        return;
      }

      // 已下班
      if (now >= end) {
        countdownEl.textContent = '🎉 放工啦！';
        moneyEl.textContent = dailySalary.toFixed(2);
        progressFillEl.style.width = '100%';
        progressPercentEl.textContent = '100%';
        updateQuote(100);
        return;
      }

      // 計算實際已工作秒數 (考慮午休時間)
      let workedSeconds = (now - start) / 1000;
      if (now > lunchStart) {
        if (now <= lunchEnd) {
          // 正處於午休時間
          workedSeconds = (lunchStart - start) / 1000;
        } else {
          // 已過午休
          workedSeconds -= lunchSeconds;
        }
      }

      const earnedMoney = Math.min(dailySalary, Math.max(0, workedSeconds * salaryPerSecond));
      const percentage = Math.min(100, Math.max(0, (workedSeconds / totalWorkSeconds) * 100));
      const remainingSeconds = (end - now) / 1000;

      // 更新畫面
      countdownEl.textContent = formatCountdown(remainingSeconds);
      moneyEl.textContent = earnedMoney.toFixed(2);
      progressFillEl.style.width = percentage.toFixed(1) + '%';
      progressPercentEl.textContent = percentage.toFixed(1) + '%';

      // 根據即時進度更新鼓勵字句
      updateQuote(percentage);
    }

    function formatCountdown(totalSecs) {
      const h = Math.floor(totalSecs / 3600).toString().padStart(2, '0');
      const m = Math.floor((totalSecs % 3600) / 60).toString().padStart(2, '0');
      const s = Math.floor(totalSecs % 60).toString().padStart(2, '0');
      return `${h}:${m}:${s}`;
    }

    // 事件監聽
    settingsBtn.addEventListener('click', () => settingsModal.classList.add('active'));
    closeSettingsBtn.addEventListener('click', () => settingsModal.classList.remove('active'));
    saveSettingsBtn.addEventListener('click', saveConfig);
    salaryTypeInput.addEventListener('change', toggleSalaryTypeUI);

    themeBtn.addEventListener('click', () => {
      const newTheme = config.theme === 'dark' ? 'light' : 'dark';
      applyTheme(newTheme);
      config.theme = newTheme;
      localStorage.setItem('offwork_countdown_config', JSON.stringify(config));
    });

    // 初始化與時鐘循環
    loadConfig();
    updateDisplay();
    setInterval(updateDisplay, 1000);
  </script>
</body>
</html>
