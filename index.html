<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>你今日返咗工未</title>
    <style>
        :root {
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --text-color: #333333;
            --sub-text: #666666;
            --accent-color: #007aff;
            --progress-bg: #e0e0e0;
            --progress-fill: linear-gradient(90deg, #4facfe, #00f2fe);
        }

        [data-theme="dark"] {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #f5f5f7;
            --sub-text: #a1a1a6;
            --accent-color: #0a84ff;
            --progress-bg: #333333;
            --progress-fill: linear-gradient(90deg, #00c6ff, #0072ff);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
            transition: background-color 0.3s, color 0.3s;
        }

        .container {
            background-color: var(--card-bg);
            border-radius: 20px;
            padding: 25px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            position: relative;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .header h1 {
            font-size: 1.2rem;
            margin: 0;
        }

        .icon-btn {
            background: none;
            border: none;
            font-size: 1.2rem;
            cursor: pointer;
            color: var(--text-color);
        }

        .display-section {
            text-align: center;
            margin-bottom: 25px;
        }

        .money-title {
            font-size: 0.9rem;
            color: var(--sub-text);
            margin-bottom: 5px;
        }

        .money-amount {
            font-size: 2.8rem;
            font-weight: 800;
            color: var(--accent-color);
            font-variant-numeric: tabular-nums;
        }

        .rate-info {
            font-size: 0.85rem;
            color: var(--sub-text);
            margin-top: 4px;
            font-weight: 500;
        }

        .countdown-title {
            font-size: 0.9rem;
            color: var(--sub-text);
            margin-top: 15px;
            margin-bottom: 5px;
        }

        .countdown-timer {
            font-size: 1.8rem;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
        }

        .progress-container {
            margin: 20px 0;
        }

        .progress-bar {
            height: 14px;
            background-color: var(--progress-bg);
            border-radius: 7px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: var(--progress-fill);
            width: 0%;
            transition: width 0.2s ease-out;
        }

        .progress-text {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            color: var(--sub-text);
            margin-top: 6px;
        }

        .quote-box {
            background-color: rgba(0, 122, 255, 0.08);
            border-radius: 12px;
            padding: 12px 15px;
            text-align: center;
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--accent-color);
            margin-top: 15px;
        }

        /* 設定彈窗 */
        .settings-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(0, 0, 0, 0.5);
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .settings-content {
            background-color: var(--card-bg);
            padding: 25px;
            border-radius: 16px;
            width: 90%;
            max-width: 380px;
        }

        .settings-content h2 {
            margin-top: 0;
            font-size: 1.2rem;
            margin-bottom: 15px;
        }

        .form-group {
            margin-bottom: 12px;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            color: var(--sub-text);
            margin-bottom: 4px;
        }

        .form-group input {
            width: 100%;
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid #ccc;
            box-sizing: border-box;
            background: var(--card-bg);
            color: var(--text-color);
        }

        .btn-group {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 20px;
        }

        .btn {
            padding: 8px 16px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-weight: 600;
        }

        .btn-primary {
            background-color: var(--accent-color);
            color: white;
        }

        .btn-secondary {
            background-color: #e0e0e0;
            color: #333;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <button class="icon-btn" id="themeToggleBtn">🌙</button>
            <h1>社畜收工計時器</h1>
            <button class="icon-btn" id="openSettingsBtn">⚙️</button>
        </div>

        <div class="display-section">
            <div class="money-title">今日累計已賺取</div>
            <div class="money-amount" id="earnedMoney">$0.000</div>
            <div class="rate-info" id="perSecondRate">每秒賺取: $0.0000</div>

            <div class="countdown-title">距離收工仲有</div>
            <div class="countdown-timer" id="countdownTimer">00:00:00</div>
        </div>

        <div class="progress-container">
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <div class="progress-text">
                <span>工時進度</span>
                <span id="progressPercent">0.0%</span>
            </div>
        </div>

        <div class="quote-box" id="quoteText">
            準備好今日返工未？
        </div>
    </div>

    <!-- 設定彈窗 -->
    <div class="settings-modal" id="settingsModal">
        <div class="settings-content">
            <h2>設定薪資與時間</h2>
            <div class="form-group">
                <label>月薪 (HKD)</label>
                <input type="number" id="monthlySalaryInput" value="20000">
            </div>
            <div class="form-group">
                <label>本月工作天數</label>
                <input type="number" id="workDaysInput" value="22">
            </div>
            <div class="form-group">
                <label>上班時間</label>
                <input type="time" id="startTimeInput" value="09:00">
            </div>
            <div class="form-group">
                <label>下班時間</label>
                <input type="time" id="endTimeInput" value="18:00">
            </div>
            <div class="btn-group">
                <button class="btn btn-secondary" id="closeSettingsBtn">取消</button>
                <button class="btn btn-primary" id="saveSettingsBtn">儲存</button>
            </div>
        </div>
    </div>

    <script>
        // 預設設定
        const defaultSettings = {
            monthlySalary: 20000,
            workDays: 22,
            startTime: "09:00",
            endTime: "18:00",
            theme: "light"
        };

        // 載入 LocalStorage
        let settings = JSON.parse(localStorage.getItem("workTimerSettings")) || defaultSettings;

        // DOM 元素
        const earnedMoneyEl = document.getElementById("earnedMoney");
        const perSecondRateEl = document.getElementById("perSecondRate");
        const countdownTimerEl = document.getElementById("countdownTimer");
        const progressFillEl = document.getElementById("progressFill");
        const progressPercentEl = document.getElementById("progressPercent");
        const quoteTextEl = document.getElementById("quoteText");
        
        const settingsModal = document.getElementById("settingsModal");
        const themeToggleBtn = document.getElementById("themeToggleBtn");

        // 廣東話鼓勵語句門檻
        function getQuote(percent) {
            if (percent >= 100) return "🎉 收工啦！躺平時間到！See you tomorrow！";
            if (percent >= 75) return "🛍️ 上網睇吓買咩衫，再堅持多陣！";
            if (percent >= 55) return "🍣 今晚食個壽司郎再叫多2碟黑碟都冇問題！";
            if (percent >= 35) return "☕ 今朝杯咖啡錢搞掂，下半場精神晒！";
            if (percent >= 20) return "🍔 成功賺返個麥當勞加大！";
            if (percent >= 10) return "🍋 可以加$2叫杯凍檸茶！加油！";
            return "💪 返工打卡！開始今日賺錢大計！";
        }

        // 主更新邏輯
        function updateCalculator() {
            const now = new Date();
            const [startH, startM] = settings.startTime.split(":").map(Number);
            const [endH, endM] = settings.endTime.split(":").map(Number);

            const startTime = new Date(now.getFullYear(), now.getMonth(), now.getDate(), startH, startM, 0);
            const endTime = new Date(now.getFullYear(), now.getMonth(), now.getDate(), endH, endM, 0);

            // 日薪與每秒薪資計算
            const dailySalary = settings.monthlySalary / settings.workDays;
            const totalWorkSeconds = (endTime - startTime) / 1000;
            const salaryPerSecond = totalWorkSeconds > 0 ? dailySalary / totalWorkSeconds : 0;

            // 顯示每秒賺幾多錢 (精確至小數點後 4 位)
            perSecondRateEl.innerText = `每秒賺取: $${salaryPerSecond.toFixed(4)}`;

            if (now < startTime) {
                // 未上班
                earnedMoneyEl.innerText = "$0.000";
                const diff = Math.floor((startTime - now) / 1000);
                countdownTimerEl.innerText = formatTime(diff);
                progressFillEl.style.width = "0%";
                progressPercentEl.innerText = "0.0%";
                quoteTextEl.innerText = "⏳ 仲未到上班時間，準備好賺錢未？";
            } else if (now >= endTime) {
                // 已下班
                earnedMoneyEl.innerText = `$${dailySalary.toFixed(3)}`;
                countdownTimerEl.innerText = "00:00:00";
                progressFillEl.style.width = "100%";
                progressPercentEl.innerText = "100.0%";
                quoteTextEl.innerText = getQuote(100);
            } else {
                // 上班中
                const elapsedSeconds = (now - startTime) / 1000;
                const earned = elapsedSeconds * salaryPerSecond;
                earnedMoneyEl.innerText = `$${earned.toFixed(3)}`;

                const remainingSeconds = Math.floor((endTime - now) / 1000);
                countdownTimerEl.innerText = formatTime(remainingSeconds);

                const percent = (elapsedSeconds / totalWorkSeconds) * 100;
                progressFillEl.style.width = `${percent.toFixed(1)}%`;
                progressPercentEl.innerText = `${percent.toFixed(1)}%`;
                quoteTextEl.innerText = getQuote(percent);
            }
        }

        function formatTime(seconds) {
            const h = Math.floor(seconds / 3600).toString().padStart(2, '0');
            const m = Math.floor((seconds % 3600) / 60).toString().padStart(2, '0');
            const s = (seconds % 60).toString().padStart(2, '0');
            return `${h}:${m}:${s}`;
        }

        // 主題切換
        function applyTheme(theme) {
            document.documentElement.setAttribute("data-theme", theme);
            themeToggleBtn.innerText = theme === "dark" ? "☀️" : "🌙";
        }

        themeToggleBtn.addEventListener("click", () => {
            settings.theme = settings.theme === "dark" ? "light" : "dark";
            applyTheme(settings.theme);
            saveSettingsToStorage();
        });

        // 設定視窗開關
        document.getElementById("openSettingsBtn").addEventListener("click", () => {
            document.getElementById("monthlySalaryInput").value = settings.monthlySalary;
            document.getElementById("workDaysInput").value = settings.workDays;
            document.getElementById("startTimeInput").value = settings.startTime;
            document.getElementById("endTimeInput").value = settings.endTime;
            settingsModal.style.display = "flex";
        });

        document.getElementById("closeSettingsBtn").addEventListener("click", () => {
            settingsModal.style.display = "none";
        });

        document.getElementById("saveSettingsBtn").addEventListener("click", () => {
            settings.monthlySalary = parseFloat(document.getElementById("monthlySalaryInput").value) || 0;
            settings.workDays = parseInt(document.getElementById("workDaysInput").value) || 1;
            settings.startTime = document.getElementById("startTimeInput").value;
            settings.endTime = document.getElementById("endTimeInput").value;

            saveSettingsToStorage();
            settingsModal.style.display = "none";
            updateCalculator();
        });

        function saveSettingsToStorage() {
            localStorage.setItem("workTimerSettings", JSON.stringify(settings));
        }

        // 初始化
        applyTheme(settings.theme);
        updateCalculator();
        setInterval(updateCalculator, 100); // 每 0.1 秒更新一次以確保流暢感
    </script>
</body>
</html>
